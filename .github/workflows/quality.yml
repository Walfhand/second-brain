name: Exemple C# - analyse statique

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: 80-Exemples/csharp-ci/Demo.csproj
  SOURCE: 80-Exemples/csharp-ci/src

jobs:
  dotnet:
    name: Analyseurs et metriques Microsoft
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 80-Exemples/csharp-ci
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.402'
      - name: Restaurer
        run: dotnet restore "$env:GITHUB_WORKSPACE/$env:PROJECT"
      - name: Compiler avec les analyseurs
        run: dotnet build "$env:GITHUB_WORKSPACE/$env:PROJECT" --configuration Release --no-restore --no-incremental --warnaserror
      - name: Generer les metriques
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/artifacts" | Out-Null
          dotnet msbuild "$env:GITHUB_WORKSPACE/$env:PROJECT" /t:Metrics /p:Configuration=Release "/p:MetricsOutputFile=$env:GITHUB_WORKSPACE/artifacts/metrics.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$report = Get-Content "$env:GITHUB_WORKSPACE/artifacts/metrics.xml"
          if (-not $report.SelectSingleNode('//Metric')) { throw 'Rapport de metriques vide' }
      - name: Conserver les metriques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metriques-csharp
          path: artifacts/metrics.xml
          if-no-files-found: warn
          retention-days: 14

  cpd:
    name: Duplication C# avec CPD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer PMD 7.29.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/pmd/pmd/releases/download/pmd_releases/7.29.0/pmd-dist-7.29.0-bin.zip \
            --output "$RUNNER_TEMP/pmd.zip"
          echo 'd27177c185b837fa57f097e482d1253468aa035379c5eb2671fa0a279109b179  '"$RUNNER_TEMP/pmd.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/pmd-bin-7.29.0/bin/pmd"
      - name: Detecter la duplication
        shell: bash
        run: |
          mkdir -p artifacts
          "$RUNNER_TEMP/pmd-bin-7.29.0/bin/pmd" cpd \
            --dir "$SOURCE" --language cs --minimum-tokens 100 \
            --format xml --report-file artifacts/cpd.xml --fail-on-error
      - name: Conserver le rapport CPD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-csharp
          path: artifacts/cpd.xml
          if-no-files-found: warn
          retention-days: 14
